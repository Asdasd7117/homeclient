workflows:
  android-debug-workflow:
    name: Build Android Client APK
    max_build_duration: 30
    scripts:
      - name: Grant execution permission to gradlew
        script: |
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew clean assembleDebug
    artifacts:
      - build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - alywm100@gmail.com
        notify:
          success: true
          failure: true
